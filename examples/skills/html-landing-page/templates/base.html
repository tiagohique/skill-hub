<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ titulo }}</title>
    <style>
      :root { --cor: #3b4cca; --texto: #1c1c28; --fundo: #ffffff; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; color: var(--texto); background: var(--fundo); line-height: 1.5; }
      .container { max-width: 56rem; margin: 0 auto; padding: 1.5rem; }
      .cta { display: inline-block; padding: 0.75rem 1.25rem; color: #fff; background: var(--cor); border-radius: 6px; text-decoration: none; }
      .cta:focus-visible { outline: 3px solid var(--texto); outline-offset: 2px; }
      .vantagens { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
    </style>
  </head>
  <body>
    <header class="container">
      <h1>{{ titulo }}</h1>
      <p>{{ resumo }}</p>
      <a class="cta" href="{{ link }}">{{ chamada_para_acao }}</a>
    </header>
    <main class="container">
      <section class="vantagens" aria-label="Vantagens">
        <article><h2>{{ vantagem_1 }}</h2><p>{{ texto_1 }}</p></article>
        <article><h2>{{ vantagem_2 }}</h2><p>{{ texto_2 }}</p></article>
        <article><h2>{{ vantagem_3 }}</h2><p>{{ texto_3 }}</p></article>
      </section>
    </main>
    <footer class="container"><small>{{ rodape }}</small></footer>
  </body>
</html>
