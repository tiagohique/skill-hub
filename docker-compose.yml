# Skills Hub (POC v3). Tudo roda em contêiner; nada da aplicação roda no host.
services:
  postgres:
    image: postgres:17
    env_file: .env
    ports:
      - "5432:5432" # só para inspeção opcional
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  hub:
    build:
      context: ./hub
      target: runtime
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Testes, lint, tipos e scripts. Uso: docker compose run --rm hub-test pytest -v
  hub-test:
    profiles: ["test"]
    build:
      context: ./hub
      target: dev
    env_file: .env
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://hub_app:hub_app_dev@postgres:5432/skillshub_test
      TEST_MIGRATION_DATABASE_URL: postgresql+asyncpg://hub_owner:hub_owner_dev@postgres:5432/skillshub_test
    volumes:
      - ./hub:/app
      - ./scripts:/scripts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
